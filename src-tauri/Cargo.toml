[package]
name = "swayfi"
version = "0.1.6"
description = "Conversor de archivos offline"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
quick-xml = "0.42"
csv = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
