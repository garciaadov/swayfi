<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swayfi</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-side">
        <button id="help-button" class="icon-button" type="button" data-i18n-label="help" aria-expanded="false" aria-controls="help-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" /><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.9v.3" /><circle class="dot" cx="12" cy="17" r=".6" /></svg>
        </button>
        <div id="help-panel" class="help-panel" hidden>
          <h2 data-i18n="helpTitle"></h2>
          <ol>
            <li data-i18n="help1"></li>
            <li data-i18n="help2"></li>
            <li data-i18n="help3"></li>
          </ol>
          <p class="muted" data-i18n="helpPrivacy"></p>
        </div>
      </div>

      <img class="logo" src="logo.png" alt="Swayfi" />

      <div class="topbar-side right">
        <button id="theme-button" class="icon-button" type="button" data-i18n-label="theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
        </button>
        <select id="lang-select" class="lang-select" data-i18n-label="language">
          <option value="es">ES</option>
          <option value="en">EN</option>
        </select>
      </div>
    </header>

    <main>
      <section id="home" class="screen">
        <button id="dropzone" class="dropzone" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5" /><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" /></svg>
          <span data-i18n="dropTitle"></span>
        </button>
        <p class="hint" data-i18n="dropHint"></p>
        <p id="home-error" class="message error" hidden></p>
      </section>

      <section id="convert" class="screen" hidden>
        <button id="back-button" class="link back" type="button">← <span data-i18n="back"></span></button>

        <div id="entries" class="entries"></div>
        <p id="skipped" class="hint" hidden></p>

        <p class="destination">
          <span data-i18n="saveTo"></span>
          <span id="destination" class="path"></span>
          <button id="folder-button" class="link" type="button" data-i18n="changeFolder"></button>
        </p>

        <button id="convert-button" class="primary" type="button" data-i18n="convert"></button>

        <div id="progress" class="progress" hidden>
          <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
          <p class="progress-line">
            <span id="progress-text"></span>
            <span id="progress-percent" class="muted"></span>
          </p>
          <button id="cancel-button" class="secondary" type="button" data-i18n="cancel"></button>
        </div>

        <div id="result" class="result" hidden>
          <p id="result-text" class="message"></p>
          <button id="open-button" class="secondary" type="button" data-i18n="openFolder"></button>
        </div>
      </section>
    </main>
  </body>
</html>
